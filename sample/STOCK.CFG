; STOCK.CFG - Stock Management System configuration
;
; COMPANY  = company name shown in the title bar (max 30 chars)
; LOWSTOCK = items with a quantity at or below this level are
;            flagged LOW (0-65535)
; CONFIRM  = ask before deleting an item (YES/NO)
; AUTOSAVE = write DATA.DAT after every change (YES/NO)
;            when NO, use F9 to save or answer the prompt on exit
COMPANY=Ersoy Hardware Supply
LOWSTOCK=10
CONFIRM=YES
AUTOSAVE=YES
